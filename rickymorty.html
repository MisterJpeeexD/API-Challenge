    <h1 style="text-align: center;">Mostrar personajes</h1>
    <div id="cont-pic"><img id="img-header" src="img/rnm.png"></div>
    <hr>
</header>
<body>
    <div id="usage-text">
        <p id="instruction-text">A continuacion, puedes buscar tus personajes seleccionando por ID, o bien, usa el boton de random para buscar uno de manera aleatoria</p>
    </div>
    <hr>
    <div id="text-search-sec">
        <label id="text-inst" for="search-box">Ingrese ID de personaje</label>
    </div>
<div id="search-container">
        <input type="text" id="search-box" class="search-sec" placeholder="Ingrese ID de personaje">
        <button id="btnBuscar" class="search-sec">Mostrar personaje</button>
        <button id="btnAleatorio" class="search-sec">
            <img id="rdm-btn" src="https://media.lordicon.com/icons/wired/lineal/194-refresh.gif">
        </button>
    </div>
    <br>
<table id="chr-table-rm">
    <tr>
        <td colspan="2" id="table-img-cell">
            <img id="picture-style" src="https://m.media-amazon.com/images/M/MV5BZGQyZjk2MzMtMTcyNC00NGU3LTlmNjItNDExMWM4ZDFhYmQ2XkEyXkFqcGc@._V1_.jpg" alt="Character Picture">
        </td>
    </tr>
    <tr class="row-style">
        <td class="cell-label">Name</td>
        <td class="cell-value" id="api-name"></td>
    </tr>
    <tr class="row-style">
        <td class="cell-label">Gender</td>
        <td class="cell-value" id="api-gender"></td>
    </tr>
    <tr class="row-style">
        <td class="cell-label">Specie</td>
        <td class="cell-value" id="api-specie"></td>
    </tr>
    <tr class="row-style">
        <td class="cell-label">Status</td>
        <td class="cell-value" id="api-status"></td>
    </tr>
</table>
