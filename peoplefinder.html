    <!-- NAVIGATION BAR -->

    <div class="container-fluid">
        <img id="home-icon" src="img/home.png" href="home.html">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="rickymorty.html">Rick y Morty</a>

<!-- NAVIGATION BAR -->
    <h1 style="text-align: center;">Buscador de personas</h1>
    <div id="cont-pic"><img id="img-header-pf" src="img/peoplefinder.png"></div>
    <hr>
</header>
<body>
    <div id="usage-text">
        <p id="instruction-text">A continuacion, puedes buscar a una persona seleccionando su ID, o bien, usa el boton de random para buscar uno de manera aleatoria</p>
    </div>
    <hr>
    <div id="text-search-sec">
        <label id="text-inst" for="search-box">Ingrese ID de la persona</label>
    </div>
<div id="search-container">
        <input type="text" id="search-box" class="search-sec" placeholder="Ingrese ID de la persona">
        <button id="btnBuscar" class="search-sec">Mostrar persona</button>
        <button id="btnAleatorio" class="search-sec">
            <img id="rdm-btn" src="https://media.lordicon.com/icons/wired/lineal/194-refresh.gif">
        </button>
    </div>
    <br>
<table id="chr-table">
    <tr class="row-style">
        <td class="cell-label">Name</td>
        <td class="cell-value" id="api-name-people"></td>
    </tr>
    <tr class="row-style">
        <td class="cell-label">Email</td>
        <td class="cell-value" id="api-email-people"></td>
    </tr>
    <tr class="row-style">
        <td class="cell-label">Phone</td>
        <td class="cell-value" id="api-phone-people"></td>
    </tr>
</table>
    <script src="script-pf.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</body>
